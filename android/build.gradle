allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "androidx.glance" &&
                details.requested.name == "glance-appwidget") {
                details.useVersion "1.1.1"
                details.because("home_widget uses 1.+ which can resolve to AGP 9-only alpha releases")
            }
            // Google Play requires Billing Library 8.0.0+ (deadline Aug 31, 2026).
            // The in-app purchase plugin already pulls 8.x; force it so an
            // older transitive SDK cannot regress the Play Console check.
            if (details.requested.group == "com.android.billingclient" &&
                details.requested.name == "billing") {
                details.useVersion "8.3.0"
                details.because("Play Console: Billing Library must be 8.0.0+")
            }
        }
    }
}

// Force Kotlin 17 for plugins that still declare 1.8 (home_widget needs this
// to inline JVM-11+ dependency bytecode). Java compileOptions on those plugins
// stay at 1.8; validation is relaxed in gradle.properties.
subprojects { subproject ->
    subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
