plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services' apply false
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Open-source GitHub builds (LMMINI_OSS=1) install next to the Play app:
// different application ID and label, and no Play Firebase config.
def ossBuild = System.getenv('LMMINI_OSS') == '1'

// Firebase config is optional for open-source builds.
if (file('google-services.json').exists() && !ossBuild) {
    apply plugin: 'com.google.gms.google-services'
}

// Release signing: LMMINI_KEYSTORE (+ _PASSWORD, LMMINI_KEY_ALIAS,
// LMMINI_KEY_PASSWORD) when set; otherwise the debug key, so
// `flutter run --release` keeps working without a keystore.
def releaseKeystore = System.getenv('LMMINI_KEYSTORE')

android {
    namespace = "net.neuro9.lmmini"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "net.neuro9.lmmini"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        if (ossBuild) applicationIdSuffix = ".oss"
        manifestPlaceholders += [appLabel: ossBuild ? "LM Mini OSS" : "LM Mini"]
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile = file(releaseKeystore)
                storePassword = System.getenv('LMMINI_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('LMMINI_KEY_ALIAS')
                keyPassword = System.getenv('LMMINI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig = releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
