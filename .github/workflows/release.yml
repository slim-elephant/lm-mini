name: Release

# Push a version tag to publish a GitHub Release (source zip/tarball attached
# automatically). Example:
#   git tag v1.8.21
#   git push origin v1.8.21
#
# This is not GitHub Packages (npm/Docker/Maven). Flutter apps are not
# published there. pubspec.yaml has publish_to: none so this is also not
# a pub.dev package.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          body: |
            Open-core snapshot of LM Mini (`packages/premium_stub`).

            Install from source:
            ```bash
            git clone https://github.com/slim-elephant/lm-mini.git
            cd lm-mini
            flutter pub get
            flutter run
            ```

            App Store / Play builds use the private Pro package and are not this tag.
