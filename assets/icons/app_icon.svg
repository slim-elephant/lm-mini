<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#312E81" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <!-- Subtle neural pattern dots -->
  <g opacity="0.08" fill="white">
    <circle cx="160" cy="160" r="6"/>
    <circle cx="320" cy="160" r="6"/>
    <circle cx="480" cy="160" r="6"/>
    <circle cx="640" cy="160" r="6"/>
    <circle cx="800" cy="160" r="6"/>
    <circle cx="160" cy="320" r="6"/>
    <circle cx="320" cy="320" r="6"/>
    <circle cx="640" cy="320" r="6"/>
    <circle cx="800" cy="320" r="6"/>
    <circle cx="160" cy="480" r="6"/>
    <circle cx="800" cy="480" r="6"/>
    <circle cx="160" cy="640" r="6"/>
    <circle cx="320" cy="640" r="6"/>
    <circle cx="640" cy="640" r="6"/>
    <circle cx="800" cy="640" r="6"/>
    <circle cx="160" cy="800" r="6"/>
    <circle cx="320" cy="800" r="6"/>
    <circle cx="480" cy="800" r="6"/>
    <circle cx="640" cy="800" r="6"/>
    <circle cx="800" cy="800" r="6"/>
  </g>
  <g stroke="white" stroke-width="1.5" opacity="0.06">
    <line x1="160" y1="160" x2="320" y2="320"/>
    <line x1="800" y1="160" x2="640" y2="320"/>
    <line x1="160" y1="800" x2="320" y2="640"/>
    <line x1="800" y1="800" x2="640" y2="640"/>
    <line x1="480" y1="160" x2="320" y2="320"/>
    <line x1="480" y1="160" x2="640" y2="320"/>
    <line x1="480" y1="800" x2="320" y2="640"/>
    <line x1="480" y1="800" x2="640" y2="640"/>
  </g>

  <!-- Chat bubble -->
  <g filter="url(#shadow)">
    <path d="M 270 260 Q 270 210, 330 210 L 694 210 Q 754 210, 754 260 L 754 560 Q 754 610, 694 610 L 440 610 L 370 700 L 390 610 L 330 610 Q 270 610, 270 560 Z"
          fill="url(#bubbleGrad)"/>
  </g>

  <!-- Faint text lines inside bubble -->
  <g opacity="0.12" fill="#4F46E5">
    <rect x="340" y="310" width="240" height="18" rx="9"/>
    <rect x="340" y="370" width="320" height="18" rx="9"/>
    <rect x="340" y="430" width="180" height="18" rx="9"/>
  </g>

  <!-- LM text in bubble -->
  <text x="512" y="470" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="210" font-weight="800" fill="#4F46E5" letter-spacing="-8">LM</text>

  <!-- AI sparkles -->
  <g transform="translate(730, 195)" fill="white" opacity="0.9">
    <path d="M 0 -22 Q 4 -4, 22 0 Q 4 4, 0 22 Q -4 4, -22 0 Q -4 -4, 0 -22 Z"/>
  </g>
  <g transform="translate(790, 250)" fill="white" opacity="0.6">
    <path d="M 0 -12 Q 2 -2, 12 0 Q 2 2, 0 12 Q -2 2, -12 0 Q -2 -2, 0 -12 Z"/>
  </g>
  <g transform="translate(240, 230)" fill="white" opacity="0.5">
    <path d="M 0 -14 Q 3 -3, 14 0 Q 3 3, 0 14 Q -3 3, -14 0 Q -3 -3, 0 -14 Z"/>
  </g>

  <!-- "mini" below -->
  <text x="512" y="810" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="120" font-weight="700" fill="white" opacity="0.95" letter-spacing="18">mini</text>

  <!-- Tagline -->
  <text x="512" y="870" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="400" fill="white" opacity="0.45" letter-spacing="6">local AI chat</text>
</svg>